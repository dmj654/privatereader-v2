name: IPA

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

concurrency:
  group: ipa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  unsigned-ipa:
    name: 产出未签名 IPA
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: 缓存 SwiftPM 依赖
        uses: actions/cache@v4
        with:
          path: |
            ReaderCore/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('ReaderCore/Package.swift', 'ReaderCore/Package.resolved') }}
          restore-keys: spm-

      - name: ReaderCore 单元测试
        run: swift test --package-path ReaderCore

      - name: 安装 XcodeGen
        run: brew install xcodegen

      - name: 生成工程
        run: xcodegen generate

      - name: 编译 arm64 真机包（不签名）
        run: |
          set -o pipefail
          xcodebuild -project PrivateReader.xcodeproj \
            -scheme PrivateReader \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            DEVELOPMENT_TEAM="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            build

      - name: 校验产物架构
        run: |
          APP="build/Build/Products/Release-iphoneos/PrivateReader.app"
          test -d "$APP" || { echo "找不到 PrivateReader.app"; exit 1; }
          lipo -info "$APP/PrivateReader"
          lipo -info "$APP/PrivateReader" | grep -q arm64 || { echo "不是 arm64 真机包"; exit 1; }

      - name: 打包成 ipa
        run: |
          APP="build/Build/Products/Release-iphoneos/PrivateReader.app"
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build
          zip -qry PrivateReader-unsigned.ipa Payload
          ls -lh PrivateReader-unsigned.ipa

      - name: 上传
        uses: actions/upload-artifact@v4
        with:
          name: PrivateReader-unsigned-ipa
          path: build/PrivateReader-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
