name: Live Source Probe

on:
  workflow_dispatch:

jobs:
  probe:
    name: 真实网络探针
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: 缓存 SwiftPM 依赖
        uses: actions/cache@v4
        with:
          path: |
            ReaderCore/.build
            ~/Library/Caches/org.swift.swiftpm
          key: spm-${{ hashFiles('ReaderCore/Package.swift', 'ReaderCore/Package.resolved') }}
          restore-keys: spm-
      - name: 跑真实源探针
        env:
          PRIVATE_READER_LIVE: "1"
        run: swift test --package-path ReaderCore --filter LiveSourceProbeTests
